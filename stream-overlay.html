<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Интерактивная сцена «Не афк» для стрима Frame Tamer.">
  <title>Не афк · Frame Tamer</title>
  <link rel="stylesheet" href="./stream-overlay.css">
  <script src="./stream-overlay.js" defer></script>
</head>
<body>
  <main class="scene" aria-label="Анимированный Frame Tamer за микрофоном в своей студии">
    <audio preload="none" hidden></audio>
    <canvas width="1672" height="941" aria-hidden="true"></canvas>
    <div class="copy">
      <span class="on-air">Frame Tamer</span>
      <h1>Не афк</h1>
      <p class="subtitle" aria-live="polite" aria-atomic="true">Чат, я тут.</p>
    </div>
    <div class="controls" aria-label="Управление оверлеем">
      <button type="button" data-action="next">Реплика</button>
      <button type="button" data-action="loop" aria-pressed="true">Авто</button>
      <button type="button" data-action="sound" aria-pressed="false">Звук</button>
    </div>
  </main>
</body>
</html>
